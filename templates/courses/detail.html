<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>{{ course.code }}</title></head>
<body>
  <p><a href="{% url 'course-list' %}">All courses</a></p>
  <h1>{{ course.title }}</h1>
  <p>{{ course.seats_left }} of {{ course.seats }} seats left.</p>
  {% if error %}<p>{{ error }}</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <label>Name <input name="student_name" required></label>
    <label>Email <input name="email" type="email" required></label>
    <button type="submit">Enroll</button>
  </form>
  <h2>Roster</h2>
  <ul>
    {% for row in enrollments %}
      <li>{{ row.student_name }} — {{ row.status }}</li>
    {% endfor %}
  </ul>
</body>
</html>
